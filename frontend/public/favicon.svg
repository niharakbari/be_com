<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .bg { fill: url(#light-bg); stroke: #cccccc; stroke-width: 2; }
    .text-main { fill: #111111; }
    .text-muted { fill: #999999; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#dark-bg); stroke: none; }
      .text-main { fill: #ffffff; }
      .text-muted { fill: #666666; }
    }
  </style>
  <defs>
    <linearGradient id="light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" class="bg" />
  <text x="50" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="300" text-anchor="middle" letter-spacing="2">
    <tspan class="text-main">P</tspan><tspan class="text-muted" font-weight="100">|</tspan><tspan class="text-main">F</tspan>
  </text>
</svg>
